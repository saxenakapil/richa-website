<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found · Richa Saxena</title>
  <meta name="theme-color" content="#3E1F5C">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Fraunces:opsz,wght,SOFT@9..144,400..800,50..100&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .lost { min-height: 100vh; display: grid; place-content: center; text-align: center; padding: 40px 16px; }
    .lost .dog { font-size: 6rem; display: inline-block; animation: wag 1s ease-in-out infinite; }
    .lost h1 { font-size: clamp(2.4rem, 8vw, 4.4rem); font-weight: 800; margin: .2em 0 .3em; }
    .lost p { color: var(--muted); max-width: 30em; margin: 0 auto 1.6em; font-size: 1.1rem; }
    @keyframes wag { 50% { transform: rotate(-8deg); } }
  </style>
</head>
<body>
  <main class="lost">
    <div><span class="dog" aria-hidden="true">🐕</span></div>
    <p class="hand">404</p>
    <h1>A dog ate this page.</h1>
    <p>I'd be upset, but honestly, look at that face. Let's get you back to somewhere that exists.</p>
    <div><a href="/" class="btn btn-primary">Take me home 🏠</a></div>
  </main>
</body>
</html>
